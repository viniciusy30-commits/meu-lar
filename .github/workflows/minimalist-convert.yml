name: Convert Minimalist clothes and build
on:
  push:
    branches: [main]
    paths:
      - 'Minimalist-CC_Everyday_Jean_Man.package'
      - 'Minimalist-CC_Everyday_Short_Man.package'
      - 'Minimalist-CC_Everyday_Top_Man.package'
      - 'ferramentas/mods_teste/T3.java'
      - 'ferramentas/mods_teste/render_minimalist_fit.py'
      - 'app/src/main/java/com/vinicius/meular/ModStore.kt'
      - 'app/src/main/java/com/vinicius/meular/CuteChar.kt'
      - '.github/workflows/minimalist-convert.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install render dependencies
        run: pip install numpy scipy pillow
      - name: Compile offline converter
        run: |
          mkdir -p /tmp/meular-classes
          javac -encoding UTF-8 -d /tmp/meular-classes app/src/main/java/com/vinicius/meular/mods/*.java ferramentas/mods_teste/T3.java
      - name: Convert clothes to native CUP1 and PNG
        run: |
          java -cp /tmp/meular-classes T3 Minimalist-CC_Everyday_Top_Man.package Minimalist-CC_Everyday_Short_Man.package Minimalist-CC_Everyday_Jean_Man.package
      - name: Validate generated assets
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          from PIL import Image
          root=Path('app/src/main/assets/cute/skate')
          for name in ('minimalist_top_am5','minimalist_short_am5','minimalist_jeans_am5'):
              cup=(root/(name+'.cup')).read_bytes()
              assert cup[:4]==b'CUP1', name+' CUP1 ausente'
              nv,ni,_=struct.unpack_from('<III',cup,4)
              assert nv>=100 and ni>=300 and ni%3==0, (name,nv,ni)
              im=Image.open(root/(name+'.png'))
              im.verify()
              print(name, 'VALID', nv, 'vertices', ni//3, 'triangulos', im.size)
          PY
      - name: Render fit diagnostics
        run: python ferramentas/mods_teste/render_minimalist_fit.py
      - uses: actions/upload-artifact@v4
        with:
          name: minimalist-fit-diagnostics
          path: fit-minimalist/
      - name: Commit converted native assets
        run: |
          git config user.name "meular-assets-bot"
          git config user.email "meular-assets-bot@users.noreply.github.com"
          git add app/src/main/assets/cute/skate/minimalist_*
          git diff --cached --quiet || git commit -m "Add native Minimalist male clothing assets"
          git push
