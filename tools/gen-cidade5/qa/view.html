<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#9cc3e6}</style></head><body>
<script type="module">
import * as THREE from './three.module.min.js';
window.render = async function(opt){
  const W=opt.w||1280,H=opt.h||720;
  const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1);
  document.body.innerHTML=''; document.body.appendChild(r.domElement);
  const sc=new THREE.Scene(); sc.background=new THREE.Color(opt.bg||0x9cc3e6); if(!opt.bg) sc.fog=new THREE.Fog(0xb7d3ea, opt.fog0||250, opt.fog1||700);
  sc.add(new THREE.AmbientLight(0xffffff,1.25)); const dl=new THREE.DirectionalLight(0xffffff,1.9); dl.position.set(-0.4,1,-0.3); sc.add(dl);
  const buf=await (await fetch(opt.file)).arrayBuffer(); const f=new Float32Array(buf);
  // registro: x y z nx ny nz r g b u v sign
  const n=f.length/12, P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3),U=new Float32Array(n*2);
  const Ps=[],Ns=[],Cs=[],Us=[];
  for(let i=0;i<n;i++){const o=i*12; if(f[o+11]>0.5){Ps.push(f[o],f[o+1],f[o+2]);Ns.push(f[o+3],f[o+4],f[o+5]);Cs.push(f[o+6],f[o+7],f[o+8]);Us.push(f[o+9],f[o+10]);}
    else{P.set([f[o],f[o+1],f[o+2]],i*3);N.set([f[o+3],f[o+4],f[o+5]],i*3);C.set([f[o+6],f[o+7],f[o+8]],i*3);} }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(P,3)); g.setAttribute('normal',new THREE.BufferAttribute(N,3)); g.setAttribute('color',new THREE.BufferAttribute(C,3));
  sc.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})));
  if(Ps.length){const gs=new THREE.BufferGeometry(); gs.setAttribute('position',new THREE.BufferAttribute(new Float32Array(Ps),3)); gs.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(Ns),3)); gs.setAttribute('color',new THREE.BufferAttribute(new Float32Array(Cs),3)); gs.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(Us),2));
    const tex=await new THREE.TextureLoader().loadAsync('atlas.png'); tex.flipY=false; tex.colorSpace=THREE.SRGBColorSpace;
    sc.add(new THREE.Mesh(gs,new THREE.MeshLambertMaterial({map:tex,vertexColors:true,side:THREE.DoubleSide,alphaTest:0.5})));}
  const cam=new THREE.PerspectiveCamera(opt.fov||60,W/H,0.3,3000); cam.position.set(...opt.eye); cam.lookAt(...opt.at);
  r.render(sc,cam); return r.domElement.toDataURL('image/png');
};
window.ready=true;
</script></body></html>
