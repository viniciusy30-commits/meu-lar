<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#9cc3e6}</style></head><body>
<script type="module">
import * as THREE from './three.module.min.js';
const texCache={};
async function tex(name){ if(!texCache[name]){ const t=await new THREE.TextureLoader().loadAsync('tex/'+name+'.jpg'); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.flipY=false; t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; texCache[name]=t;} return texCache[name]; }
window.render = async function(opt){
  const W=opt.w||1280,H=opt.h||720;
  const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1);
  r.outputColorSpace=THREE.SRGBColorSpace;
  document.body.innerHTML=''; document.body.appendChild(r.domElement);
  const sc=new THREE.Scene(); sc.background=new THREE.Color(opt.bg||0x9cc3e6); if(!opt.bg) sc.fog=new THREE.Fog(0xb7d3ea, opt.fog0||600, opt.fog1||2600);
  sc.add(new THREE.HemisphereLight(0xdfe9f5,0x6d6455,1.6)); const dl=new THREE.DirectionalLight(0xfff4e0,2.2); dl.position.set(0.45,1,0.65); sc.add(dl);
  for(const gdef of opt.groups){
    const buf=await (await fetch(gdef.file)).arrayBuffer(); const f=new Float32Array(buf); const n=f.length/11;
    const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3),U=new Float32Array(n*2);
    for(let i=0;i<n;i++){const o=i*11; P[i*3]=f[o];P[i*3+1]=f[o+1];P[i*3+2]=f[o+2];N[i*3]=f[o+3];N[i*3+1]=f[o+4];N[i*3+2]=f[o+5];C[i*3]=f[o+6];C[i*3+1]=f[o+7];C[i*3+2]=f[o+8];U[i*2]=f[o+9];U[i*2+1]=f[o+10];}
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(P,3)); g.setAttribute('normal',new THREE.BufferAttribute(N,3));
    g.setAttribute('color',new THREE.BufferAttribute(C,3)); g.setAttribute('uv',new THREE.BufferAttribute(U,2));
    const m=new THREE.MeshLambertMaterial({map:await tex(gdef.tex),vertexColors:true,side:opt.front?THREE.FrontSide:THREE.DoubleSide});
    sc.add(new THREE.Mesh(g,m));
  }
  const dd=Math.hypot(opt.eye[0]-opt.at[0],opt.eye[1]-opt.at[1],opt.eye[2]-opt.at[2]);
  const cam=new THREE.PerspectiveCamera(opt.fov||60,W/H,Math.max(0.3,dd/800),Math.max(4000,dd*3)); cam.position.set(...opt.eye); cam.lookAt(...opt.at);
  r.render(sc,cam); return r.domElement.toDataURL('image/png');
};
window.ready=true;
</script></body></html>
